# 隆圭琢玉备份配置：只有这个文件需要你按现场改，backup-db.sh 不用动
#
# 外置硬盘：插上盘后挂到 EXT_DIRS 里写的任一路径即可，脚本每次跑都会往那里导一份。
#   挂载方法（假设盘是 /dev/sdb1）：
#     mkdir -p /mnt/usb-jade && mount /dev/sdb1 /mnt/usb-jade
#   想开机自动挂就往 /etc/fstab 加一行：
#     /dev/sdb1  /mnt/usb-jade  ext4  defaults,nofail  0  2
#   nofail 很关键：盘没插时不会卡住开机。
# 没挂盘时备份照样跑，只在 /opt/jade/backup/backup.log 记一行「外置盘未挂载」。
EXT_DIRS="/mnt/usb-jade/jade-backup"

# 本地留几份（每 7 天一份，4 份 = 4 周），外置盘留 12 份 ≈ 3 个月
RETAIN_LOCAL=4
RETAIN_EXT=12

# 每次备份后把包还原进临时库比对，验证通过才算成功；想临时关掉改 0
VERIFY=1

# 一般不用改
DB_NAME=db_jade
LOCAL_DIR=/opt/jade/backup
DB_CONTAINER=jade-db
MIN_FREE_MB=300
