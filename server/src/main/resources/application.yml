server:
  port: 8080
  # 静态库近 1MB，隧道链路只有几十 KB/s，不压缩要等 20 秒以上，浏览器会直接报协议错误
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  application:
    name: jade-server
  datasource:
    url: jdbc:mysql://127.0.0.1:${DB_PORT:3307}/db_jade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭，避免把业务数据打到控制台；排查时用 MYBATIS_LOG=stdout 打开
    log-impl: ${MYBATIS_LOG:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto

jade:
  jwt:
    # 签名密钥：生产必须用环境变量覆盖（至少 32 字节）。演示环境留了默认值，正式部署要换掉。
    secret: ${JADE_JWT_SECRET:<CHANGE_ME_32_BYTES_OR_LONGER>}
    # 载荷加密密钥：留空时由 secret 派生；生产建议单独给一个，与签名密钥分开
    enc-secret: ${JADE_JWT_ENC_SECRET:}
    expire-hours: ${JADE_JWT_EXPIRE_HOURS:8}

logging:
  level:
    com.jade: info
    com.jade.mapper: warn
