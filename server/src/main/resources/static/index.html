<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232c5f7a'/%3E%3Ctext x='16' y='23' font-size='20' fill='white' text-anchor='middle'%3E玉%3C/text%3E%3C/svg%3E">
<title>隆圭琢玉经营管理系统</title>
<link rel="icon" type="image/png" href="/logo.png?v=2">
<link rel="stylesheet" href="lib/element-plus.css">
<script src="lib/vue.js"></script>
<script src="lib/element-plus.js"></script>
<script src="lib/zh-cn.js"></script>
<style>
  *{box-sizing:border-box}
  /* ============================================================
     隆圭琢玉视觉规范（管理端）
     底色 宣纸 #F5F0E6   主色 墨玉 #22352F   点缀 哑金 #A9843F
     强调 朱砂 #B23A2B   正文 #2C3531   次要 #6B7772   分隔 #E6DECF
     标题衬线（宋体系），正文无衬线；圆角 4px；阴影极浅
     ============================================================ */
  :root{
    --paper:#F5F0E6; --paper-2:#FBF7F0; --card:#FFFFFF;
    --jade-900:#22352F; --jade-700:#2C4A41; --jade-500:#48685C; --jade-300:#7C9A8E;
    --gold:#A9843F; --gold-2:#8A6B2F; --gold-soft:#E8DCC4;
    --cinnabar:#B23A2B;
    --text:#2C3531; --text-2:#6B7772; --text-3:#8A948F;
    --line:#E6DECF; --line-2:#F0E9DC;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",sans-serif;

    --el-color-primary:#2C4A41; --el-color-primary-light-3:#6B807A; --el-color-primary-light-5:#96A5A0;
    --el-color-primary-light-7:#C0C9C6; --el-color-primary-light-8:#D5DBD9; --el-color-primary-light-9:#EAEDEC;
    --el-color-primary-dark-2:#233B34;
    --el-color-danger:#B23A2B; --el-color-danger-light-9:#F7EAE7; --el-color-warning:#A9843F;
    --el-color-success:#4E8A6B; --el-color-success-light-9:#EDF4F0; --el-color-info:#8A948F;
    --el-border-radius-base:3px; --el-border-radius-small:2px;
    --el-border-color:#E0D8C9; --el-border-color-light:#EDE6D9; --el-border-color-lighter:#F2ECE0;
    --el-text-color-primary:#2C3531; --el-text-color-regular:#2C3531; --el-text-color-secondary:#6B7772;
    --el-text-color-placeholder:#8F9893; --el-text-color-disabled:#A9B0AC;
    --el-bg-color:#FFFFFF; --el-bg-color-overlay:#FFFFFF; --el-fill-color-blank:#FFFFFF;
    --el-fill-color-light:#F7F3EA; --el-fill-color-lighter:#FBF8F1;
    --el-font-family:var(--sans); --el-font-size-base:13.5px;
    --el-table-border-color:#EFE8DB; --el-table-header-bg-color:#F5F0E4;
    --el-table-header-text-color:#2C3531; --el-table-text-color:#2C3531;
    --el-table-row-hover-bg-color:#FAF6EC;
  }
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--text)}
  #app{height:100vh}

  /* ---------- 登录 ---------- */
  .login-wrap{height:100vh;display:flex;background:var(--paper)}
  .login-panel{flex:1;min-width:0;background:linear-gradient(160deg,#1B2A25,#22352F 55%,#2C4A41);
    color:#F3EDE1;padding:56px 60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .login-panel::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 80% 0%,rgba(198,165,96,.16),transparent 55%),
      radial-gradient(ellipse at 0% 100%,rgba(198,165,96,.10),transparent 50%)}
  .login-panel .seal-logo{width:52px;height:52px;border-radius:50%;display:block;margin-bottom:26px;
    box-shadow:0 0 0 1px rgba(198,165,96,.7), 0 0 0 4px rgba(198,165,96,.14)}
  .login-panel .kicker-en{font-family:var(--serif);font-size:9.5px;letter-spacing:5px;color:rgba(198,165,96,.75);margin:-18px 0 24px}
  .login-panel .kicker{font-size:12px;letter-spacing:6px;color:rgba(243,237,225,.7);margin-bottom:12px}
  .login-panel h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:3px;color:#F7F2E7}
  .login-panel .sub{margin-top:18px;font-size:13.5px;line-height:2;color:rgba(243,237,225,.72);
    padding-left:14px;border-left:2px solid rgba(198,165,96,.55);max-width:420px}
  .login-form{flex:none;width:420px;background:var(--card);display:flex;align-items:center;justify-content:center;
    border-left:1px solid var(--line)}
  .login-card{width:330px}
  .login-card h2{margin:0 0 6px;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:2px;color:var(--jade-900)}
  .login-card p.sub{margin:0 0 28px;font-size:12.5px;color:var(--text-2)}
  .login-card .el-button{font-family:var(--serif);letter-spacing:4px;font-size:15px;height:44px}
  .login-card .tip{margin-top:18px;font-size:12px;color:var(--text-2);text-align:center}

  /* ---------- 侧栏 ---------- */
  .side{background:var(--jade-900);position:relative}
  .side .el-menu{border-right:none;background:transparent}
  .side .el-menu-item{color:#C6D2CC;height:42px;line-height:42px;font-size:13.5px;margin:1px 8px;border-radius:3px}
  .side .el-menu-item:hover{background:rgba(255,255,255,.06);color:#F1EBDF}
  .side .el-menu-item.is-active{background:rgba(255,255,255,.08)!important;color:#F7F2E7;font-weight:600}
  .side .el-menu-item.is-active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
    background:var(--gold);border-radius:1px}
  .side .el-menu-item-group__title{padding:16px 18px 6px!important;font-size:11px;letter-spacing:3px;color:#8FA69B}
  .side .grp{color:#8FA69B;letter-spacing:3px}
  .brandbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#F3EDE1;
    border-bottom:1px solid rgba(198,165,96,.22)}
  .brandbar .seal-logo{width:30px;height:30px;border-radius:50%;display:block;
    box-shadow:0 0 0 1px rgba(198,165,96,.7)}
  .brandbar .name{font-family:var(--serif);font-size:15px;letter-spacing:2px}
  .brandbar .ver{margin-left:auto;font-size:10.5px;color:#7E948A;letter-spacing:.5px}

  /* ---------- 顶栏 ---------- */
  .topbar{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 24px}
  .topbar .title{font-family:var(--serif);font-size:17px;color:var(--jade-900);font-weight:600;letter-spacing:2px;
    display:flex;align-items:center;gap:10px}
  .topbar .title::before{content:'';width:3px;height:15px;background:var(--gold);border-radius:1px}
  .page{padding:20px 24px 44px;overflow-y:auto;height:calc(100vh - 60px)}
  .page-title{font-family:var(--serif);font-size:16px;color:var(--jade-900);letter-spacing:1.5px;
    margin:2px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}

  /* ---------- 统计卡 ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px 14px;
    position:relative;overflow:hidden}
  .stat-card::after{content:'';position:absolute;left:0;bottom:0;width:38px;height:2px;background:var(--gold)}
  .stat-card .label{font-size:12px;color:var(--text-2);margin-bottom:8px;letter-spacing:.5px}
  .stat-card .value{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--jade-900);letter-spacing:.5px}
  .stat-card .unit{font-size:13px;color:var(--text-2);margin-left:4px;font-weight:400;font-family:var(--sans)}

  /* ---------- 日历 ---------- */
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .cal-col{background:var(--card);border:1px solid var(--line);border-radius:4px;min-height:320px;
    display:flex;flex-direction:column}
  .cal-hd{display:flex;justify-content:space-between;padding:9px 11px;font-size:12px;color:var(--text-2);
    border-bottom:1px solid var(--line-2);font-family:var(--serif);letter-spacing:.5px}
  .cal-hd.today{background:#F3EEE1;color:var(--gold-2);font-weight:600}
  .cal-md{color:var(--text-3)}
  .cal-body{flex:1;padding:9px;display:flex;flex-direction:column;gap:6px}
  .cal-empty{color:var(--text-3);text-align:center;font-size:12px;padding-top:8px}
  .ev{border-radius:3px;padding:6px 8px;font-size:12px;line-height:1.6;border-left:2px solid var(--jade-500);
    background:#F1F5F3}
  .ev-reserve{border-left-color:var(--jade-500);background:#F1F5F3}
  .ev-visit{border-left-color:var(--gold);background:#F8F3E8}
  .ev-task{border-left-color:#4E8A6B;background:#EFF5F1}
  .ev-t{color:var(--text)}
  .ev-s{color:var(--text-2);font-size:11px;margin-top:2px}

  /* ---------- 报表条形 / 趋势 ---------- */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
  .bar-lb{width:96px;color:var(--text-2);flex:none}
  .bar-track{flex:1;height:8px;background:#F1EBDF;border-radius:4px;overflow:hidden}
  .bar-fill{display:block;height:8px;background:var(--jade-500);border-radius:4px}
  .bar-val{width:96px;text-align:right;color:var(--text);flex:none}

  /* ---------- 通用 ---------- */
  .thumb{width:46px;height:46px;border-radius:3px;background:var(--paper-2);object-fit:cover;display:block}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .pager{margin-top:16px;display:flex;justify-content:flex-end}
  .empty-tip{padding:40px;text-align:center;color:var(--text-3);font-size:13px;font-family:var(--serif);letter-spacing:1px}
  .tag-line{display:flex;gap:5px;flex-wrap:wrap}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .hint{font-size:12px;color:var(--text-2);margin-top:4px}

  /* ---------- Element Plus 组件微调 ---------- */
  .el-card{border-color:var(--line)!important;border-radius:4px!important}
  .el-card__header{padding:13px 18px!important;font-family:var(--serif);font-size:15px;font-weight:600;
    color:var(--jade-900);letter-spacing:1px;border-bottom:1px solid var(--line-2)!important}
  .el-card__body{padding:16px 18px!important}
  .el-table th.el-table__cell{background:#F5F0E4!important;font-family:var(--serif);font-weight:600;letter-spacing:.5px}
  .el-table .el-table__cell{padding:9px 0}
  .el-table td.el-table__cell{font-size:13px}
  .el-dialog{border-radius:4px!important}
  .el-dialog__title{font-family:var(--serif);font-size:16px!important;letter-spacing:1px;color:var(--jade-900)!important}
  .el-dialog__header{padding-bottom:14px!important;border-bottom:1px solid var(--line-2)}
  .el-form-item__label{color:var(--text-2)!important;font-size:13px}
  .el-button{font-weight:400}
  .el-tag{border-radius:2px!important}
  .el-message{border-radius:3px!important}
  .el-tabs__item{font-family:var(--serif);letter-spacing:1px}
  .el-pagination{font-size:13px}
  @media (max-width:1080px){
    .login-panel{padding:40px 36px}
    .login-form{width:360px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

const api = {
  token: () => localStorage.getItem('jade_token') || '',
  async req(method, path, body) {
    const opt = { method, headers: { 'Content-Type': 'application/json' } };
    const t = api.token();
    if (t) opt.headers.Authorization = 'Bearer ' + t;
    if (body !== undefined) opt.body = JSON.stringify(body);
    const url = path.startsWith('/api') ? path : '/api' + path;
    let res, d;
    try { res = await fetch(url, opt); d = await res.json(); }
    catch (e) { return { code: -1, message: '网络错误，请稍后重试' }; }
    // 登录接口自己的 401 是"用户名或口令错误"，要透给表单提示，不当会话失效处理
    if (res.status === 401 && !url.includes('/auth/login')) {
      localStorage.removeItem('jade_token'); localStorage.removeItem('jade_user');
      ElMessage.error('登录已失效，请重新登录');
      setTimeout(() => location.reload(), 800);
    }
    return d;
  },
  get: (p) => api.req('GET', p), post: (p, b) => api.req('POST', p, b),
  put: (p, b) => api.req('PUT', p, b), del: (p) => api.req('DELETE', p),
};
const money = (v) => (Number(v || 0)).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const fmtTime = (v) => (v ? String(v).replace('T', ' ') : '');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const monthStart = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; };
function tip(r, okMsg) {
  if (r.code === 0) { if (okMsg) ElMessage.success(okMsg); return true; }
  ElMessage.error(r.message || '操作失败'); return false;
}

const Login = {
  template: `
  <div class="login-wrap">
    <div class="login-panel">
      <img class="seal-logo" src="/logo.png?v=2" alt="隆圭琢玉">
      <div class="kicker">隆 圭 琢 玉</div>
      <div class="kicker-en">LONGGUI JADE</div>
      <h1>顾客服务与经营管理系统</h1>
      <div class="sub">单店玉器零售 · 一物一码 · 图与货对应<br>柜台端给老板与销售用：货品建档、成交与分期、客户档案、同行调货、寄售结算、加工上门。</div>
    </div>
    <div class="login-form"><div class="login-card">
      <h2>登 录</h2>
      <p class="sub">柜台端账号由门店管理员开通</p>
      <el-form @submit.prevent="go">
        <el-form-item><el-input v-model="f.username" placeholder="用户名" size="large" clearable /></el-form-item>
        <el-form-item><el-input v-model="f.password" type="password" placeholder="口令" size="large" show-password @keyup.enter="go" /></el-form-item>
        <el-button type="primary" size="large" style="width:100%" :loading="busy" @click="go">进 入 系 统</el-button>
      </el-form>
      <p class="tip">忘记口令请联系门店管理员</p>
    </div></div>
  </div>`,
  setup() {
    const f = reactive({ username: '', password: '' });
    const busy = ref(false);
    const go = async () => {
      if (!f.username || !f.password) return ElMessage.warning('请输入用户名与口令');
      busy.value = true;
      const r = await api.post('/auth/login', { username: f.username, password: f.password });
      busy.value = false;
      if (r.code === 0) {
        localStorage.setItem('jade_token', r.data.token);
        localStorage.setItem('jade_user', JSON.stringify(r.data.user));
        ElMessage.success('登录成功'); location.reload();
      } else ElMessage.error(r.message || '登录失败');
    };
    return { f, busy, go };
  }
};

const Dashboard = {
  template: `
  <div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">本月净销售额</div><div class="value">{{ money(s.netAmount) }}<span class="unit">元</span></div></div>
      <div class="stat-card"><div class="label">本月成交</div><div class="value">{{ s.saleCount }}<span class="unit">笔</span></div></div>
      <div class="stat-card"><div class="label">销售客户数</div><div class="value">{{ s.customerCount }}<span class="unit">人</span></div></div>
      <div class="stat-card"><div class="label">加权周转周期</div><div class="value">{{ t.weightedDays || 0 }}<span class="unit">天</span></div></div>
    </div>
    <el-row :gutter="16">
      <el-col :span="8"><el-card shadow="never" header="本月成交构成">
        <div style="font-size:13px;line-height:2.1">
          <div>成交金额 <b style="float:right">{{ money(s.amount) }}</b></div>
          <div>退货冲减 <b style="float:right;color:#4E8A6B">{{ money(s.returnAmount) }}</b></div>
          <div style="border-top:1px dashed #EFE8DB;margin-top:6px;padding-top:6px">净额 <b style="float:right">{{ money(s.netAmount) }}</b></div>
        </div></el-card></el-col>
      <el-col :span="8"><el-card shadow="never" header="待办">
        <div style="font-size:13px;line-height:2.1">
          <div>待审核出让申请 <b style="float:right">{{ todo.applies }}</b></div>
          <div>待确认完工 <b style="float:right">{{ todo.deliveries }}</b></div>
          <div>今日到店预定 <b style="float:right">{{ todo.bookings }}</b></div>
        </div></el-card></el-col>
      <el-col :span="8"><el-card shadow="never" header="周转最慢">
        <div v-if="!t.slowest || !t.slowest.length" class="empty-tip">暂无数据</div>
        <div v-for="g in (t.slowest||[]).slice(0,4)" :key="g.goodsNo"
          style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #EFE8DB">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ g.name }}</span>
          <span style="color:#6B7772;flex:none;margin-left:8px">{{ g.days }} 天</span></div>
      </el-card></el-col>
    </el-row>
  </div>`,
  setup() {
    const s = reactive({ amount: 0, returnAmount: 0, netAmount: 0, customerCount: 0, saleCount: 0 });
    const t = reactive({ weightedDays: 0, slowest: [] });
    const todo = reactive({ applies: 0, deliveries: 0, bookings: 0 });
    onMounted(async () => {
      const f = monthStart(), to = today();
      const [a, b, c, d, e] = await Promise.all([
        api.get(`/stats/sales?from=${f}&to=${to}`), api.get(`/stats/turnover?from=${f}&to=${to}`),
        api.get('/transfer-applies?status=' + encodeURIComponent('待审核')), api.get('/delivery-applies?status=' + encodeURIComponent('待确认')),
        api.get('/bookings/today')]);
      if (a.code === 0) Object.assign(s, a.data);
      if (b.code === 0) Object.assign(t, b.data);
      if (c.code === 0) todo.applies = c.data.length;
      if (d.code === 0) todo.deliveries = d.data.length;
      if (e.code === 0) todo.bookings = e.data.length;
    });
    return { s, t, todo, money };
  }
};

const Goods = {
  template: `
  <div>
    <div class="toolbar">
      <el-input v-model="q.keyword" placeholder="编号或品名" clearable style="width:190px" @keyup.enter="load" />
      <el-select v-model="q.status" placeholder="状态" clearable style="width:120px" @change="load">
        <el-option v-for="x in statusList" :key="x" :label="x" :value="x" /></el-select>
      <el-select v-model="q.categoryId" placeholder="类别" clearable style="width:120px" @change="load">
        <el-option v-for="c in cats" :key="c.id" :label="c.name" :value="c.id" /></el-select>
      <el-button type="primary" @click="load">查询</el-button>
      <el-button type="success" @click="openCreate">登记入库</el-button>
      <span style="margin-left:auto;font-size:13px;color:#6B7772">共 {{ total }} 件</span>
    </div>
    <el-table :data="rows" size="small" border stripe @row-click="openDetail">
      <el-table-column label="图" width="60"><template #default="{row}">
        <img v-if="row.image" :src="row.image" class="thumb" @error="e=>e.target.style.visibility='hidden'"/>
        <div v-else class="thumb" style="display:flex;align-items:center;justify-content:center;color:#8A948F;font-size:11px">无图</div>
      </template></el-table-column>
      <el-table-column prop="goodsNo" label="编号" width="182" />
      <el-table-column prop="name" label="品名" min-width="140" show-overflow-tooltip />
      <el-table-column prop="categoryName" label="类别" width="86" />
      <el-table-column prop="material" label="料种" width="110" show-overflow-tooltip />
      <el-table-column prop="weightG" label="克重" width="76" align="right" />
      <el-table-column label="最低售价" width="98" align="right"><template #default="{row}">{{ money(row.minPrice) }}</template></el-table-column>
      <el-table-column label="状态" width="82"><template #default="{row}">
        <el-tag :type="tagType(row.status)" size="small">{{ row.status }}</el-tag></template></el-table-column>
      <el-table-column label="精选" width="64" align="center"><template #default="{row}">
        <el-tag v-if="row.isFeatured===1" type="danger" size="small">荐</el-tag></template></el-table-column>
    </el-table>

      found, notFound, belowMin, busy, customers, f, ret, inst, pay,

        <div class="hint">只统计采购、调货、加工、寄售四类往来；零售成交计入上方销售额，不在这里重复计算。</div>
      </el-card></el-col>
      <el-col :span="14"><el-card shadow="never" header="往来货款趋势">
        <svg viewBox="0 0 600 140" preserveAspectRatio="none" style="width:100%;height:140px">

        <el-table :data="t.slowest || []" size="small" max-height="300">

        </el-table>
      </el-card></el-col>
    </el-row>
  </div>`,
  setup() {
    const range = ref([]), quick = ref('month');
    const s = reactive({ amount: 0, returnAmount: 0, netAmount: 0, customerCount: 0, saleCount: 0 });
    const t = reactive({ weightedDays: 0, sampleCount: 0, slowest: [] });
    const ov = reactive({ collected: 0, paymentCount: 0, dailyAvg: 0, avgTicket: 0,
      overdueCount: 0, overdueAmount: 0, byType: [], trend: [] });
    const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const setQuick = () => {
      const now = new Date(); let from;
      if (quick.value === 'month') from = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (quick.value === 'quarter') from = new Date(now.getFullYear(), now.getMonth()-2, 1);
      else from = new Date(now.getFullYear(), 0, 1);
      range.value = [fmt(from), fmt(now)]; load();
    };
    const load = async () => {
      if (!range.value || range.value.length !== 2) return;
      const [f, to] = range.value;
      const [a, b, c] = await Promise.all([
        api.get(`/stats/sales?from=${f}&to=${to}`), api.get(`/stats/turnover?from=${f}&to=${to}`),
        api.get(`/stats/overview?from=${f}&to=${to}`)]);
      if (a.code === 0) Object.assign(s, a.data);
      if (b.code === 0) Object.assign(t, b.data);
      if (c.code === 0) Object.assign(ov, c.data);
    };
    onMounted(setQuick);
    const maxType = computed(() => {
      let m = 0;
      ov.byType.forEach(x => { m = Math.max(m, Number(x.amount) || 0); });
      return m || 1;
    });
    const barW = (v) => Math.round((Number(v) || 0) / maxType.value * 100) + '%';
    const trendPoints = computed(() => {
      const arr = ov.trend || [];
      if (!arr.length) return '';
      let max = 0;
      arr.forEach(x => { max = Math.max(max, Number(x.amount) || 0); });
      max = max || 1;
      const step = arr.length > 1 ? 600 / (arr.length - 1) : 0;
      return arr.map((x, i) => `${(i * step).toFixed(1)},${(130 - (Number(x.amount) || 0) / max * 110).toFixed(1)}`).join(' ');
    });
    const rangeDays = computed(() => {
      if (!range.value || range.value.length !== 2) return 1;
      const a = new Date(range.value[0]).getTime();
      const b = new Date(range.value[1]).getTime();
      return Math.max(1, Math.round((b - a) / 86400000) + 1);
    });
    const dailyNet = computed(() => (Number(s.netAmount) || 0) / rangeDays.value);
    const avgTicket = computed(() => (Number(s.saleCount) || 0) ? (Number(s.netAmount) || 0) / s.saleCount : 0);
    const trendHint = computed(() => {
      const arr = ov.trend || [];
      if (!arr.length) return '区间内没有收款记录';
      const sum = arr.reduce((a, x) => a + (Number(x.amount) || 0), 0);
      return `${arr.length} 个有收款的日子，合计 ${money(sum)} 元，峰值 ${money(Math.max(...arr.map(x => Number(x.amount) || 0)))} 元`;
    });
    return { range, quick, s, t, ov, setQuick, load, money, barW, trendPoints, trendHint, dailyNet, avgTicket };
  }
};

  setup() {
    const rows = ref([]), total = ref(0), page = ref(1), size = ref(15);
    const merchants = ref([]), merchantId = ref(null), settled = ref('');
    const dlg = ref(false);
    const f = reactive({ direction: '调出', merchantId: null, goodsNo: '' });
    const load = async () => {
      const p = new URLSearchParams({ page: page.value, size: size.value });
      if (merchantId.value) p.set('merchantId', merchantId.value);
      if (settled.value) p.set('settled', settled.value);
      const r = await api.get('/transfers?' + p);
      if (r.code === 0) { rows.value = r.data.items; total.value = r.data.total; }
    };
    const openCreate = () => { f.direction = '调出'; f.merchantId = null; f.goodsNo = ''; dlg.value = true; };
    const submit = async () => {
      if (!f.merchantId || !f.goodsNo) return ElMessage.warning('商户与货品必填');

      const p = await api.get('/source-parties?partyType=' + encodeURIComponent('同行商户'));
      if (p.code === 0) merchants.value = p.data;

};

    const tab = ref('apply');

    const merchantId = ref(null), method = ref('转账'), history = ref([]);
    const selectedSum = computed(() => selected.value.reduce((a, b) => a + Number(b.amount || 0), 0));

    const loadApplies = async () => {
      const r = await api.get('/transfer-applies?status=' + encodeURIComponent('待审核'));
      applies.value = r.code === 0 ? r.data : [];
    };
    const loadPending = async () => {
      if (!merchantId.value) { pending.value = []; return; }
      const r = await api.get('/settlements/pending?merchantId=' + merchantId.value);
      pending.value = r.code === 0 ? r.data.items : [];
    };
    const loadHistory = async () => {
      const r = await api.get('/settlements');
      history.value = r.code === 0 ? r.data : [];
    };
    const onTab = (name) => {
      if (name === 'apply') loadApplies();
      if (name === 'settle') loadPending();
      if (name === 'history') loadHistory();
    };
    const audit = async (row, pass) => {
      let opinion = '';
      const title = pass ? '通过申请' : '驳回申请';
      const opts = {
        inputPlaceholder: pass ? '审核意见（可留空）' : '驳回原因（必填）',
        confirmButtonText: pass ? '通过' : '驳回',
        cancelButtonText: '取消',
      };
      if (!pass) opts.inputValidator = v => (!!v && v.trim()) || '必须填写原因';
      const res = await ElMessageBox.prompt(pass ? '审核意见（可留空）' : '驳回原因（必填）', title, opts)
        .catch(() => null);
      if (res === null) return;
      opinion = res.value || '';
      const r = await api.post('/transfer-applies/' + row.id + '/audit', { pass, opinion });
      if (tip(r, pass ? '已通过' : '已驳回')) loadApplies();
    };
    const settle = async () => {
      const r = await api.post('/settlements/batch', {
        merchantId: merchantId.value, transferIds: selected.value.map(x => x.transferId), settleMethod: method.value });
      if (tip(r, '结算完成')) { selected.value = []; loadPending(); loadHistory(); }
    };
    onMounted(async () => {
      const m = await api.get('/source-parties?partyType=' + encodeURIComponent('同行商户'));
      if (m.code === 0) merchants.value = m.data;
      loadApplies();
    });
    return { tab, applies, merchants, pending, selected, merchantId, method, history, selectedSum,
      loadPending, onTab, audit, settle, money, fmtTime };
  }
};

          </template></el-table-column>
        </el-table>

          <el-table-column prop="apptParty" label="预约方" width="150" />

            {{ row.expectDate }} {{ row.startTime }}–{{ row.endTime }}</template></el-table-column>
          <el-table-column prop="status" label="状态" width="90" />
          <el-table-column label="提交时间" width="160"><template #default="{row}">{{ fmtTime(row.submitTime) }}</template></el-table-column>
          <el-table-column label="操作" width="130"><template #default="{row}">
            <el-button v-if="row.status==='待上门'" link type="success" size="small" @click="visit(row,'confirm')">确认</el-button>
            <el-button v-if="row.status==='待上门'" link type="danger" size="small" @click="visit(row,'cancel')">取消</el-button>
          </template></el-table-column>
        </el-table>
        <div v-if="!visits.length" class="empty-tip">没有上门预约</div>
      </el-tab-pane>
    </el-tabs>
  </div>`,
  setup() {
    const tab = ref('task'), status = ref(''), total = ref(0), page = ref(1), size = ref(15);
    const overdueOnly = ref(false), overdueCount = ref(0);
    const tasks = ref([]), deliveries = ref([]), visits = ref([]);
    const statusList = ['待加工', '在加工', '待交付', '已交付'];
    const loadTasks = async () => {
      const p = new URLSearchParams({ page: page.value, size: size.value });
      if (status.value) p.set('status', status.value);
      if (overdueOnly.value) p.set('overdueOnly', 'true');
      const r = await api.get('/process-tasks?' + p);
      if (r.code === 0) {
        tasks.value = r.data.items; total.value = r.data.total;
        overdueCount.value = r.data.overdueCount || 0;
      }
    };
    const loadDeliveries = async () => {
      const r = await api.get('/delivery-applies?status=' + encodeURIComponent('待确认'));
      deliveries.value = r.code === 0 ? r.data : [];
    };
    const loadVisits = async () => {
      const r = await api.get('/visit-appts');
      visits.value = r.code === 0 ? r.data : [];
    };
    const onTab = (n) => { if (n === 'task') loadTasks(); if (n === 'delivery') loadDeliveries(); if (n === 'visit') loadVisits(); };
    const start = async (row) => {
      const r = await api.post('/process-tasks/' + row.id + '/start');
      if (tip(r, '已开始加工')) loadTasks();
    };
    const urge = async (row) => {
      const r = await api.post('/process-tasks/' + row.id + '/urge');
      if (r.code === 0) { ElMessage.success('已催办，师傅端任务上会显示第 ' + r.data.urgeCount + ' 次'); loadTasks(); }
      else ElMessage.warning(r.message || '催办失败');
    };
    const confirm = async (row, accepted) => {
      let opinion = '';
      if (!accepted) {
        const res = await ElMessageBox.prompt('退回原因', '退回完工申请', {
          inputValidator: v => (!!v && v.trim()) || '必须填写原因',
          confirmButtonText: '退回', cancelButtonText: '取消' }).catch(() => null);
        if (res === null) return;
        opinion = res.value;
      }
      const r = await api.post('/delivery-applies/' + row.id + '/confirm', { accepted, opinion });
      if (tip(r, accepted ? '已接受，任务置已交付' : '已退回')) loadDeliveries();
    };
    const visit = async (row, act) => {
      const r = await api.post('/visit-appts/' + row.id + '/' + act);
      if (tip(r, act === 'confirm' ? '已确认交接' : '已取消')) loadVisits();
    };
    onMounted(loadTasks);
    return { tab, status, total, page, size, tasks, deliveries, visits, statusList,
      overdueOnly, overdueCount,
      loadTasks, loadDeliveries, loadVisits, onTab, start, urge, confirm, visit, money, fmtTime };
  }
};

const Calendar = {
  template: `
  <div>
    <div class="toolbar">
      <el-button @click="shift(-1)">上一周</el-button>
      <el-button @click="thisWeek">本周</el-button>
      <el-button @click="shift(1)">下一周</el-button>
      <span style="margin-left:10px;color:#6B7772;font-size:13px">{{ from }} ~ {{ to }}</span>
      <span style="margin-left:auto;font-size:12px;color:#6B7772">
        到店 {{ counts.reserve }} · 上门 {{ counts.visit }} · 加工到期 {{ counts.task }}</span>
    </div>
    <div class="cal">
      <div class="cal-col" v-for="d in days" :key="d.date">
        <div class="cal-hd" :class="{today: d.isToday}">
          <span>{{ d.label }}</span><span class="cal-md">{{ d.md }}</span>
        </div>
        <div class="cal-body">
          <div class="ev" :class="'ev-' + e.type" v-for="e in d.events" :key="e.type + e.ref">
            <div class="ev-t">{{ e.at.slice(11) }} {{ e.title }}</div>
            <div class="ev-s">{{ e.sub }}</div>
          </div>
          <div class="cal-empty" v-if="!d.events.length">—</div>
        </div>
      </div>
    </div>
    <div class="hint" style="padding:12px 2px 0">
      到店预约取到店时间；上门取预约时段；加工按期限日排。加工已完成或已取消的不再占日历。
    </div>
  </div>`,
  setup() {
    const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const monday = (d) => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); x.setHours(0,0,0,0); return x; };
    const start = ref(monday(new Date()));
    const from = ref(fmt(start.value));
    const to = ref('');
    const events = ref([]);
    const days = computed(() => {
      const out = [];
      const names = ['周一','周二','周三','周四','周五','周六','周日'];
      const today = fmt(new Date());
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.value); d.setDate(d.getDate() + i);
        const key = fmt(d);
        out.push({
          date: key,
          label: names[i],
          md: key.slice(5),
          isToday: key === today,
          events: events.value.filter(e => String(e.at).slice(0, 10) === key)
        });
      }
      return out;
    });
    const counts = computed(() => {
      const c = { reserve: 0, visit: 0, task: 0 };
      events.value.forEach(e => { if (c[e.type] !== undefined) c[e.type]++; });
      return c;
    });
    const load = async () => {
      const end = new Date(start.value); end.setDate(end.getDate() + 6);
      from.value = fmt(start.value);
      to.value = fmt(end);
      const r = await api.get(`/calendar?from=${from.value}&to=${to.value}`);
      if (r.code === 0) events.value = r.data; else ElMessage.error(r.message);
    };
    const shift = (n) => { const d = new Date(start.value); d.setDate(d.getDate() + n * 7); start.value = d; load(); };
    const thisWeek = () => { start.value = monday(new Date()); load(); };
    onMounted(load);
    return { from, to, days, counts, shift, thisWeek };
  }
};

      <el-button type="primary" @click="load(1)">查 询</el-button>
    </div>
    <el-table :data="rows" size="small" border stripe>
      <el-table-column label="时间" width="170"><template #default="{row}">{{ fmtTime(row.time) }}</template></el-table-column>
      <el-table-column label="操作人" width="200"><template #default="{row}">{{ row.name || '—' }}<span style="color:#8A948F">（{{ row.username || '匿名' }}）</span></template></el-table-column>
      <el-table-column prop="method" label="动作" width="80" align="center" />
      <el-table-column prop="path" label="对象（路径含单据号）" min-width="300" show-overflow-tooltip />
      <el-table-column label="结果" width="100" align="center"><template #default="{row}"><span :style="{color: row.status<400?'#4E8A6B':'#B23A2B'}">{{ row.status<400 ? '成功' : '失败 ' + row.status }}</span></template></el-table-column>
    </el-table>
    <div class="pager"><el-pagination v-model:current-page="page" :page-size="size" :total="total" layout="prev, pager, next" @current-change="p => load(p)" /></div>
  </div>`,
  setup() {
    const rows = ref([]), total = ref(0), page = ref(1), size = ref(20), keyword = ref('');
    const load = async (p) => {
      page.value = p;
      const q = new URLSearchParams({ page: p, size: size.value });
      if (keyword.value) q.set('keyword', keyword.value);
      const r = await api.get('/op-logs?' + q.toString());
      if (tip(r)) { rows.value = r.data.items; total.value = r.data.total; }
    };
    onMounted(() => load(1));
    return { rows, total, page, size, keyword, load, fmtTime };
  }
};

const Layout = {
  template: `
  <el-container style="height:100vh">
    <el-aside width="208px" class="side">
      <div class="brandbar">
        <img class="seal-logo" src="/logo.png?v=2" alt="隆圭琢玉">
        <span class="name">隆圭琢玉</span>
        <span class="ver">v1.0</span>
      </div>
      <el-menu :default-active="page" @select="go">
        <el-menu-item-group v-for="g in visibleGroups" :key="g.title">
          <template #title><span class="grp">{{ g.title }}</span></template>
          <el-menu-item v-for="k in g.keys" :key="k" :index="k">{{ pages[k].label }}</el-menu-item>
        </el-menu-item-group>
      </el-menu>
      <div style="position:absolute;bottom:12px;left:0;width:208px;text-align:center;font-size:11px;color:#6E857B">隆圭琢玉</div>
    </el-aside>
    <el-container>
      <el-header class="topbar" height="60px">
        <div class="title">{{ currentLabel }}</div>
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:13px;color:#6B7772">{{ displayName }}（{{ roleNames }}）</span>
          <el-button link type="primary" size="small" @click="logout">退出</el-button>
        </div>
      </el-header>
      <div class="page"><component :is="view" :key="page" /></div>
    </el-container>
  </el-container>`,
  setup() {
    const pages = {
      dashboard: { label: '概览', comp: Dashboard },
      goods: { label: '货品管理', comp: Goods },
      sales: { label: '成交与退货', comp: Sales },
      installments: { label: '分期管理', comp: Installments },
      stats: { label: '销售与周转', comp: Stats, perm: 'UC-06' },
      customers: { label: '客户档案', comp: Customers },
      transfers: { label: '同行调货', comp: Transfers },
      approval: { label: '审核与结算', comp: Approval },
      consign: { label: '寄售合同', comp: Consign },
      process: { label: '加工与上门', comp: Process },
      calendar: { label: '经营日历', comp: Calendar },
      users: { label: '账号与角色', comp: Users, perm: 'UC-12' },
      base: { label: '基础数据', comp: Base },
      oplog: { label: '操作日志', comp: OpLog, perm: 'UC-12' },
    };
    const page = ref('dashboard');
    // 菜单按业务域分组，不再 11 项平铺
    const menuGroups = [
      { title: '概览', keys: ['dashboard'] },
      { title: '经营', keys: ['calendar', 'goods', 'sales', 'installments', 'stats'] },
      { title: '客户', keys: ['customers'] },
      { title: '往来', keys: ['transfers', 'approval', 'consign', 'process'] },
      { title: '系统', keys: ['users', 'base', 'oplog'] },
    ];
    const user = JSON.parse(localStorage.getItem('jade_user') || '{}');
    const roleNames = (user.roles || []).map(r => r.name).join('、') || '—';
    // 姓名里已带"（老板）"这类后缀时不再叠一遍角色名
    const displayName = String(user.name || '').replace(/（[^）]*）$/, '');
    // 菜单按登录账号的权限裁剪：缺对应权限码的页直接不出现（接口层另有 @RequirePerm 兜底）
    const perms = new Set(user.permissions || []);
    const canSee = (k) => !pages[k].perm || perms.has(pages[k].perm);
    const visibleGroups = menuGroups
      .map(g => ({ ...g, keys: g.keys.filter(canSee) }))
      .filter(g => g.keys.length);
    const view = computed(() => pages[page.value].comp);
    const currentLabel = computed(() => pages[page.value].label);
    const go = (k) => { if (!pages[k] || !canSee(k)) return; page.value = k; };
    const logout = async () => {
      await api.post('/auth/logout');
      localStorage.removeItem('jade_token'); localStorage.removeItem('jade_user'); location.reload();
    };
    return { page, pages, visibleGroups, view, currentLabel, user, displayName, roleNames, go, logout };
  }
};

const app = createApp({
  components: { Login, Layout },
  template: `<component :is="page" />`,
  setup() {
    // 柜台端只给老板与销售用：外部角色（供应商/师傅/商户）的会话在这页按未登录处理，
    // 不清 storage（别把外部端自己的会话连带杀掉），接口层另有 @RequirePerm 兜底
    const page = computed(() => {
      if (!api.token()) return 'Login';
      try {
        const u = JSON.parse(localStorage.getItem('jade_user') || '{}');
        const roles = (u.roles || []).map(r => r.code);
        if (!roles.includes('BOSS') && !roles.includes('SALE')) return 'Login';
      } catch (e) { return 'Login'; }
      return 'Layout';
    });
    return { page };
  }
});
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
